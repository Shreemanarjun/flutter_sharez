name: Flutter Workflow

on:
  pull_request:
    branches:
      - main
      - master

permissions: read-all

jobs:
  build-and-release:
    runs-on: ${{ (github.event.pull_request.head.repo.full_name == github.repository) && 'self-hosted' || 'ubuntu-latest' }}

    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # 🚀 SPEED & SPACE OPTIMIZATION:
      # Skip setup actions if we are on the self-hosted machine (which already has them)
      - name: Setup Java (Only on GitHub Runners)
        if: runner.name != 'self-hosted'
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter (Only on GitHub Runners)
        if: runner.name != 'self-hosted'
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 🧹 PRE-BUILD CLEAN: Highly recommended for self-hosted runners to keep disk space low
      - name: Clean build artifacts
        run: flutter clean

      - name: Solve dependencies
        run: flutter pub get

      - name: Run unit tests
        run: flutter test --coverage

      - name: Build APKs
        run: |
          flutter build apk --release
          flutter build apk --split-per-abi

      - id: read-version
        uses: NiklasLehnfeld/flutter-version-number-action@main
        with:
          file-path: pubspec.yaml

      - name: Push to Releases
        uses: ncipollo/release-action@v1
        with:
          artifacts: "build/app/outputs/flutter-apk/*.apk"
          tag: v${{ steps.read-version.outputs.version-number }}
          token: ${{ secrets.TOKEN }}
          generateReleaseNotes: true

      - name: "Build Changelog"
        uses: mikepenz/release-changelog-builder-action@v4
        with:
          configuration: ".github/workflows/configs/configuration.json"
          ignorePreReleases: "false"
          commitMode: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
